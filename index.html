<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Unificada</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <nav>
            <button onclick="switchSection('home')">Inicio</button>
            <button onclick="switchSection('citas')">Citas</button>
            <button onclick="switchSection('documentos')">Trámites</button>
        </nav>
    </header>

    <main>
        <section id="sec-home" class="active">
            <div class="kpi-container">
                <div class="kpi-box" id="kpi-box-por-tomar">Por Tomar: <span id="stat-citas-por-tomar">0</span></div>
                <div class="kpi-box" id="kpi-box-tramites">PQRS: <span id="stat-tramites-activos">0</span></div>
                <div class="kpi-box" id="kpi-box-hoy">Citas Hoy: <span id="stat-citas-hoy">0</span></div>
            </div>

            <button class="btn-primary" onclick="toggleSelectorEntrada()">➕ Nuevo Registro</button>

            <div class="agenda-header">
                <button onclick="navegarSemana(-1)">◀ Anterior</button>
                <span id="weekly-range-label"></span>
                <button onclick="navegarSemana(1)">Siguiente ▶</button>
            </div>
            <div id="home-weekly-agenda"></div>
        </section>
    </main>

    <div id="selector-entrada" class="popup-modal" style="display:none;">
        <div class="popup-content">
            <h3>¿Qué deseas registrar hoy?</h3>
            <button onclick="abrirModal('medico')">🏥 Acto Médico</button>
            <button onclick="abrirModal('pqrs')">📄 Trámite PQRS</button>
            <button onclick="abrirModal('judicial')">⚖️ Trámite Judicial</button>
            <button onclick="toggleSelectorEntrada()">Cerrar</button>
        </div>
    </div>

    <div id="modal-medico" class="popup-modal" style="display:none;">
        <div class="popup-content">
            <h3>Nueva Cita Médica</h3>
            <input type="text" id="med-paciente" placeholder="Paciente" required>
            <input type="date" id="med-fecha" required>
            <select id="med-hora-hh"></select>
            <select id="med-hora-mm">
                <option value="00">00</option>
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="45">45</option>
            </select>
            <input type="text" id="med-institucion" placeholder="Institución" required>
            <button onclick="guardarRegistroMedico()">Guardar</button>
        </div>
    </div>

    <div id="modal-pqrs" class="popup-modal" style="display:none;">
        <div class="popup-content">
            <h3>Radicar PQRS</h3>
            <button onclick="cerrarModal('pqrs')">Cerrar</button>
        </div>
    </div>

    <div id="modal-judicial" class="popup-modal" style="display:none;">
        <div class="popup-content">
            <h3>Trámite Judicial</h3>
            <button onclick="cerrarModal('judicial')">Cerrar</button>
        </div>
    </div>

    <script src="modulo-citas.js"></script>
</body>
</html>
